server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx ya incluye /etc/nginx/mime.types globalmente
    # (html, png, svg, woff2, webmanifest). No redefinir `types` aquí:
    # un bloque types local reemplazaría el mapa por defecto.

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # fuentes e íconos: cache larga (versionados/estables)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # webmanifest: nginx 1.27 no trae este tipo en su mapa; se fija solo aquí
    location = /site.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # HTML: sin cache agresiva para poder actualizar el manual
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
